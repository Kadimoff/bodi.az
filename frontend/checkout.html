<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Təhlükəsiz Ödəniş - Bodi.az</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=73ee4108">
<script src="assets/js/tw-config.js"></script>
</head>
<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">

<div id="site-header"></div>

<main class="flex-grow w-full max-w-container-max mx-auto px-4 md:px-gutter py-md md:py-xl">
  <!-- Secure header -->
  <div class="flex items-center gap-2 mb-lg text-primary">
    <span class="material-symbols-outlined">lock</span>
    <h1 class="font-headline-md text-headline-md">Təhlükəsiz Ödəniş</h1>
  </div>

  <!-- Steps -->
  <div class="flex items-center mb-xl max-w-2xl" id="step-bar">
    <div class="flex flex-col items-center" data-step="1">
      <div class="step-ring w-9 h-9 rounded-full flex items-center justify-center font-label-md bg-primary text-on-primary">1</div>
      <span class="step-label font-label-sm text-label-sm mt-2 text-primary">Çatdırılma</span>
    </div>
    <div class="flex-grow h-0.5 mx-2 bg-surface-variant step-line" style="margin-top:-18px"></div>
    <div class="flex flex-col items-center" data-step="2">
      <div class="step-ring w-9 h-9 rounded-full flex items-center justify-center font-label-md bg-surface-variant text-on-surface-variant">2</div>
      <span class="step-label font-label-sm text-label-sm mt-2 text-on-surface-variant">Ödəniş</span>
    </div>
    <div class="flex-grow h-0.5 mx-2 bg-surface-variant step-line" style="margin-top:-18px"></div>
    <div class="flex flex-col items-center" data-step="3">
      <div class="step-ring w-9 h-9 rounded-full flex items-center justify-center font-label-md bg-surface-variant text-on-surface-variant">3</div>
      <span class="step-label font-label-sm text-label-sm mt-2 text-on-surface-variant">Yoxlama</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-xl">
    <!-- Form -->
    <div class="md:col-span-8 space-y-lg">
      <!-- Shipping -->
      <section id="shipping-section" class="bg-surface-container-lowest rounded-2xl p-lg card-ambient">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-md">Çatdırılma Məlumatları</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
          <div class="md:col-span-2"><label class="font-label-md text-label-md text-on-surface block mb-2">Ad və Soyad</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Məsələn: Leyla Əliyeva" required></div>
          <div><label class="font-label-md text-label-md text-on-surface block mb-2">Telefon Nömrəsi</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="+994 -- --- -- --" required></div>
          <div><label class="font-label-md text-label-md text-on-surface block mb-2">Şəhər</label><select class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none"><option>Bakı</option><option>Sumqayıt</option><option>Gəncə</option></select></div>
          <div class="md:col-span-2"><label class="font-label-md text-label-md text-on-surface block mb-2">Ünvan</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="Küçə adı, bina, mənzil..." required></div>
          <div><label class="font-label-md text-label-md text-on-surface block mb-2">Poçt İndeksi</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="AZ1000"></div>
        </div>
      </section>

      <!-- Payment -->
      <section id="payment-section" class="bg-surface-container-lowest rounded-2xl p-lg card-ambient transition-opacity duration-300">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-md">Ödəniş Üsulu</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-md mb-md">
          <label class="pay-opt cursor-pointer border-2 border-primary bg-primary-fixed/20 rounded-xl p-md flex items-start gap-3" data-pay="online">
            <input class="sr-only" type="radio" name="pay" checked>
            <span class="material-symbols-outlined text-primary pay-check ms-fill">check_circle</span>
            <div><div class="font-label-md text-label-md text-on-surface">Onlayn Ödəniş</div><div class="font-body-sm text-body-sm text-on-surface-variant">Kart ilə dərhal ödəyin</div></div>
          </label>
          <label class="pay-opt cursor-pointer border-2 border-outline-variant rounded-xl p-md flex items-start gap-3" data-pay="cod">
            <input class="sr-only" type="radio" name="pay">
            <span class="material-symbols-outlined text-on-surface-variant pay-check" style="visibility:hidden">check_circle</span>
            <div><div class="font-label-md text-label-md text-on-surface">Qapıda Ödəniş</div><div class="font-body-sm text-body-sm text-on-surface-variant">Nağd və ya kartla</div></div>
          </label>
        </div>

        <div id="card-fields" class="grid grid-cols-1 md:grid-cols-3 gap-md">
          <div class="md:col-span-3"><label class="font-label-md text-label-md text-on-surface block mb-2">Kart nömrəsi</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="0000 0000 0000 0000" maxlength="19"></div>
          <div><label class="font-label-md text-label-md text-on-surface block mb-2">Bitmə tarixi</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="MM/YY" maxlength="5"></div>
          <div><label class="font-label-md text-label-md text-on-surface block mb-2">CVV</label><input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none" placeholder="***" type="password" maxlength="3"></div>
          <div class="flex items-end gap-2 text-on-surface-variant"><span class="material-symbols-outlined">credit_card</span><span class="font-body-sm text-body-sm">Birkart və Tamkart ilə taksit mümkündür</span></div>
        </div>
      </section>

      <!-- Nav buttons -->
      <div class="flex justify-between gap-md">
        <a href="cart.html" class="inline-flex items-center gap-2 px-6 py-4 border-2 border-outline-variant rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">
          <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span> Səbətə qayıt
        </a>
        <button id="next-btn" class="inline-flex items-center gap-2 bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-lg hover:bg-primary-container transition-colors shadow-sm">
          Ödənişə keç <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- Order summary -->
    <aside class="md:col-span-4">
      <div class="bg-surface-container-low rounded-2xl p-lg md:sticky md:top-24">
        <h2 class="font-headline-md text-headline-md text-on-surface mb-md">Sifarişin xülasəsi</h2>
        <div id="summary-items" class="space-y-3 mb-md max-h-64 overflow-auto hide-scroll"></div>
        <form class="flex gap-2 mb-md" onsubmit="return false">
          <input class="flex-grow px-3 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm outline-none focus:border-primary" placeholder="Promokod">
          <button class="px-4 py-2 bg-on-surface text-surface rounded-lg font-label-sm text-label-sm" onclick="STORE.toast('Promokod tətbiq edildi','local_activity')">Tətbiq et</button>
        </form>
        <div class="space-y-2 font-body-md text-body-md border-t border-surface-variant pt-md">
          <div class="flex justify-between"><span class="text-on-surface-variant">Məhsullar</span><span id="sum-sub">—</span></div>
          <div class="flex justify-between"><span class="text-on-surface-variant">Çatdırılma</span><span class="text-primary font-label-md">PULSUZ</span></div>
          <div class="flex justify-between items-center pt-2 border-t border-surface-variant mt-2"><span class="font-headline-sm text-headline-sm">Cəmi</span><span id="sum-total" class="font-headline-md text-headline-md text-primary">—</span></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-md">
          <div class="flex items-center gap-2 justify-center bg-surface-container-lowest rounded-lg p-sm"><span class="material-symbols-outlined text-primary" style="font-size:18px">lock</span><span class="font-body-sm text-body-sm text-center">SSL Təhlükəsizlik</span></div>
          <div class="flex items-center gap-2 justify-center bg-surface-container-lowest rounded-lg p-sm"><span class="material-symbols-outlined text-primary" style="font-size:18px">change_circle</span><span class="font-body-sm text-body-sm text-center">30 Gün Qaytarma</span></div>
        </div>
      </div>
    </aside>
  </div>
</main>

<div id="site-footer"></div>
<div id="mobile-nav"></div>

<script src="assets/js/products.js?v=7dccd3e5"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
(function () {
  // Summary
  const rows = STORE.cartDetailed();
  const t = STORE.cartTotals();
  document.getElementById("summary-items").innerHTML = rows.map(r => `
    <div class="flex gap-3 items-center">
      <div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-container-lowest flex-shrink-0"><img src="${BODI.ph(r.product.color, r.product.name)}" class="w-full h-full object-cover"></div>
      <div class="flex-grow min-w-0">
        <div class="font-body-sm text-body-sm text-on-surface clamp-2">${r.product.name}</div>
        <div class="font-body-sm text-body-sm text-on-surface-variant">${r.item.qty} × ${BODI.money(r.product.price)}</div>
      </div>
      <div class="font-body-sm text-body-sm text-on-surface whitespace-nowrap">${BODI.money(r.line)}</div>
    </div>`).join("") || `<p class="font-body-sm text-body-sm text-on-surface-variant">Səbət boşdur.</p>`;
  document.getElementById("sum-sub").textContent = BODI.money(t.subtotal);
  document.getElementById("sum-total").textContent = BODI.money(t.total);

  // Payment option toggle
  document.querySelectorAll(".pay-opt").forEach(opt => opt.addEventListener("click", () => {
    document.querySelectorAll(".pay-opt").forEach(o => { o.classList.remove("border-primary", "bg-primary-fixed/20"); o.classList.add("border-outline-variant"); o.querySelector(".pay-check").classList.remove("ms-fill", "text-primary"); o.querySelector(".pay-check").classList.add("text-on-surface-variant"); o.querySelector(".pay-check").style.visibility = "hidden"; });
    opt.classList.add("border-primary", "bg-primary-fixed/20"); opt.classList.remove("border-outline-variant");
    const chk = opt.querySelector(".pay-check"); chk.classList.add("ms-fill", "text-primary"); chk.classList.remove("text-on-surface-variant"); chk.style.visibility = "visible";
    document.getElementById("card-fields").style.display = opt.getAttribute("data-pay") === "online" ? "" : "none";
  }));

  // Step machine
  let step = 1;
  const next = document.getElementById("next-btn");
  function setStep(s) {
    step = s;
    document.querySelectorAll("#step-bar [data-step]").forEach(el => {
      const n = Number(el.getAttribute("data-step"));
      const ring = el.querySelector(".step-ring");
      const lbl = el.querySelector(".step-label");
      if (n <= step) { ring.className = "step-ring w-9 h-9 rounded-full flex items-center justify-center font-label-md bg-primary text-on-primary"; lbl.className = "step-label font-label-sm text-label-sm mt-2 text-primary"; ring.innerHTML = n < step ? '<span class="material-symbols-outlined" style="font-size:18px">check</span>' : n; }
      else { ring.className = "step-ring w-9 h-9 rounded-full flex items-center justify-center font-label-md bg-surface-variant text-on-surface-variant"; lbl.className = "step-label font-label-sm text-label-sm mt-2 text-on-surface-variant"; ring.textContent = n; }
    });
    document.querySelectorAll(".step-line").forEach((l, i) => { l.classList.toggle("bg-primary", i < step - 1); l.classList.toggle("bg-surface-variant", i >= step - 1); });
  }
  next.addEventListener("click", () => {
    if (step < 3) { setStep(step + 1); next.innerHTML = step === 3 ? 'Sifarişi tamamla <span class="material-symbols-outlined" style="font-size:18px">check</span>' : 'Ödənişə keç <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>'; window.scrollTo({ top: 0, behavior: "smooth" }); }
    else {
      next.disabled = true; next.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size:18px">progress_activity</span> İşlənilir...';
      setTimeout(() => {
        STORE.clearCart();
        STORE.toast("Sifarişiniz qəbul edildi!", "check_circle");
        setTimeout(() => location.href = "track-order.html?ok=1", 1200);
      }, 1600);
    }
  });
})();
</script>
</body>
</html>
