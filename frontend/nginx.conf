# Docker's embedded DNS; re-resolving keeps working when the api container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    set $api_upstream http://api:4000;

    # Behind a host reverse proxy (HTTPS), take the client IP from X-Forwarded-For
    # so per-IP rate limits apply per visitor, not to the proxy as a whole.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip Compression for Fast PageSpeed & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security & Crawling Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Backend: storefront API, admin panel, dynamic sitemap
    location ^~ /api/ {
        proxy_pass $api_upstream;
    }

    location ^~ /admin {
        proxy_pass $api_upstream;
    }

    location = /sitemap.xml {
        proxy_pass $api_upstream;
    }

    # Uploaded media (shared volume, written by the api container)
    location ^~ /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SEO pages: <head> (title, meta, OpenGraph, JSON-LD) is rendered by the
    # backend; if it is unreachable the static file is served unchanged.
    location = / {
        set $page_uri /index.html;
        rewrite ^ /ssr/index.html break;
        proxy_pass $api_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_page;
    }

    location ~ ^/(index|product|category|blog-post|about|faq|contact|reviews|blog)\.html$ {
        set $page_uri $uri;
        rewrite ^/(.*)$ /ssr/$1 break;
        proxy_pass $api_upstream;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_page;
    }

    location @static_page {
        try_files $page_uri =404;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }

    # Media & Font Asset Caching (Safe long-term cache)
    location ~* \.(?:jpg|jpeg|gif|png|svg|webp|avif|ico|woff2?|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Scripts & Stylesheets (Revalidatable, cache-busting friendly)
    location ~* \.(?:css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
