name: bodi-ecommerce

# Bodi.az: storefront (nginx) + own backend (Node.js/Fastify) + PostgreSQL.
# This file is the production stack (Coolify deploys it; the reverse proxy
# routes the domain to the "frontend" service on port 80). Local development
# settings — host port 7777, live-mounted files — are in docker-compose.override.yml.
# Secrets come from the environment (.env locally, Coolify variables on the server).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bodi}
      POSTGRES_USER: ${POSTGRES_USER:-bodi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD təyin edilməlidir}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # No `network: host`: Docker ≥29 (BuildKit bake) refuses it without --allow=network.host,
      # which Coolify doesn't pass. npm reaches the registry fine over the default build network.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-bodi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bodi}
      SITE_URL: ${SITE_URL:-https://bodi.az}
      ADMIN_ROOT_USERNAME: ${ADMIN_ROOT_USERNAME:-root}
      ADMIN_ROOT_PASSWORD: ${ADMIN_ROOT_PASSWORD:?ADMIN_ROOT_PASSWORD təyin edilməlidir}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - uploads:/srv/uploads:ro

volumes:
  pg_data:
  uploads:
