name: bodi-ecommerce

services:
  db:
    image: mariadb:11.4
    container_name: bodi-db
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      MARIADB_DATABASE: bodi_wordpress
      MARIADB_USER: bodi_user
      MARIADB_PASSWORD: ***REMOVED***
      MARIADB_ROOT_PASSWORD: ***REMOVED***
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bodi_network

  wordpress:
    image: wordpress:php8.3-apache
    container_name: bodi-wp
    restart: unless-stopped
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8085:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: bodi_user
      WORDPRESS_DB_PASSWORD: ***REMOVED***
      WORDPRESS_DB_NAME: bodi_wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      - ./docker/apache-allowoverride.conf:/etc/apache2/conf-enabled/allowoverride.conf:ro
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./backend/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./docker/wp-cli.phar:/usr/local/bin/wp:ro
    networks:
      - bodi_network

  frontend:
    image: nginx:1.27-alpine
    container_name: bodi-frontend
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8096:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bodi_network

networks:
  bodi_network:
    driver: bridge

volumes:
  db_data:
  wp_data:
